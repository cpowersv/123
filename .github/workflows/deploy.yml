name: Deploy Audivue to GitHub Pages

# Publishes the static app to GitHub Pages on every push to the branch.
# One-time setup: repo Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". After that this workflow gives you a live URL.

on:
  push:
    branches:
      - claude/audivue-app-30is5q
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
